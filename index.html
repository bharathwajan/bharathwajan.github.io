<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bharathwajan Rajendran | Developer</title>
  <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="assets/css/themify-icons.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0b;
      --bg-card: #141416;
      --bg-elevated: #1c1c1f;
      --border: #2a2a2d;
      --text: #fafafa;
      --text-secondary: #a1a1aa;
      --accent: #f97316;
      --accent-2: #fb923c;
      --gradient: linear-gradient(135deg, #f97316 0%, #ec4899 100%);
      --radius: 16px;
      --radius-sm: 10px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Nav */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      padding: 16px 0;
      backdrop-filter: blur(20px);
      background: rgba(10, 10, 11, 0.8);
      border-bottom: 1px solid var(--border);
    }

    nav .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-weight: 700;
      font-size: 1.2rem;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-links { display: flex; gap: 32px; list-style: none; }

    .nav-links a {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-secondary);
      transition: color 0.3s;
    }

    .nav-links a:hover { color: var(--text); }

    .nav-toggle { display: none; background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; }

    /* Hero */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle at 30% 50%, rgba(249,115,22,0.08) 0%, transparent 50%),
                  radial-gradient(circle at 70% 50%, rgba(236,72,153,0.05) 0%, transparent 50%);
      animation: heroGlow 10s ease-in-out infinite alternate;
    }

    @keyframes heroGlow {
      from { transform: translate(0, 0); }
      to { transform: translate(-2%, 2%); }
    }

    .hero-content { position: relative; z-index: 1; }

    .hero-label {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--accent);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
      padding: 6px 14px;
      background: rgba(249,115,22,0.1);
      border: 1px solid rgba(249,115,22,0.2);
      border-radius: 50px;
    }

    .hero h1 {
      font-size: clamp(2.8rem, 6vw, 5rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 24px;
      letter-spacing: -0.03em;
    }

    .hero h1 span {
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: 1.15rem;
      color: var(--text-secondary);
      max-width: 540px;
      margin-bottom: 36px;
    }

    .hero-btns { display: flex; gap: 16px; flex-wrap: wrap; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: var(--gradient);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(249,115,22,0.3);
    }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1.5px solid var(--border);
    }

    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    /* Sections */
    section { padding: 100px 0; }

    .section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 48px;
    }

    /* About */
    .about-grid {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 60px;
      align-items: start;
    }

    .about-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: var(--radius);
      border: 2px solid var(--border);
    }

    .about-text p {
      color: var(--text-secondary);
      font-size: 1.05rem;
      margin-bottom: 28px;
    }

    .about-meta {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      list-style: none;
      margin-bottom: 32px;
    }

    .about-meta li {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .about-meta li strong {
      color: var(--text);
      display: block;
      font-size: 0.8rem;
      margin-bottom: 2px;
    }

    /* Experience & Education */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
    }

    .timeline { list-style: none; position: relative; }

    .timeline::before {
      content: '';
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: var(--border);
      border-radius: 2px;
    }

    .timeline li {
      padding-left: 28px;
      margin-bottom: 32px;
      position: relative;
    }

    .timeline li::before {
      content: '';
      position: absolute;
      left: -4px;
      top: 8px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(249,115,22,0.4);
    }

    .timeline .date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .timeline h4 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .timeline .org {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .timeline .extra {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 4px;
      opacity: 0.7;
    }

    /* Services */
    .services-section { background: var(--bg-card); }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 24px;
    }

    .service-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      transition: all 0.4s ease;
    }

    .service-card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .service-card .icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: rgba(249,115,22,0.1);
      margin-bottom: 20px;
      font-size: 1.3rem;
      color: var(--accent);
    }

    .service-card h3 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .service-card p {
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .skill-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

    .skill-tag {
      font-size: 0.8rem;
      padding: 6px 14px;
      border-radius: 50px;
      background: rgba(249,115,22,0.08);
      border: 1px solid rgba(249,115,22,0.2);
      color: var(--accent-2);
      font-weight: 500;
      transition: all 0.3s;
    }

    .skill-tag:hover {
      background: rgba(249,115,22,0.15);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    /* Contact */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 40px;
      align-items: start;
    }

    .contact-info { list-style: none; }

    .contact-info li {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
      color: var(--text-secondary);
    }

    .contact-info li .icon-box {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: rgba(249,115,22,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
    }

    .contact-form-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      min-height: 500px;
    }

    .contact-form-wrap iframe {
      width: 100%;
      min-height: 500px;
      height: 100%;
      border: none;
      display: block;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 48px 0;
    }

    .footer-grid {
      display: flex;
      justify-content: space-between;
      align-items: start;
      flex-wrap: wrap;
      gap: 32px;
    }

    .footer-links { list-style: none; }
    .footer-links li { margin-bottom: 8px; }

    .footer-links a {
      font-size: 0.9rem;
      color: var(--text-secondary);
      transition: color 0.3s;
    }

    .footer-links a:hover { color: var(--accent); }

    .footer-label {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text);
      margin-bottom: 12px;
    }

    .footer-bottom {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .nav-toggle { display: block; }
      .nav-links.active {
        display: flex;
        flex-direction: column;
        position: absolute;
        top: 60px; left: 0; right: 0;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        padding: 24px;
        gap: 16px;
      }
      .about-grid { grid-template-columns: 1fr; gap: 32px; }
      .about-img { max-width: 250px; }
      .two-col { grid-template-columns: 1fr; gap: 48px; }
      .contact-grid { grid-template-columns: 1fr; }
      .hero h1 { font-size: 2.5rem; }
    }

    /* Scroll animations */
    .fade-up {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .fade-up.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- All content is rendered by JavaScript from the DATA object below -->
  <div id="app"></div>

  <script>
    // ╔══════════════════════════════════════════════════════════════════╗
    // ║  EDIT YOUR DATA HERE — everything on the site comes from this  ║
    // ╚══════════════════════════════════════════════════════════════════╝
    const DATA = {

      initials: "BR",
      tagline: "Software Engineer",
      heroHeading: "Hi, I'm <span>Bharathwajan<br>Rajendran</span>",

        meta: [

          { label: "From", value: "Tamilnadu, India" },

      ],

      skills: [
        { category: "Backend & Core", items: ["Java", "Spring Boot", "Spring Security", "Spring Data JPA", "Spring Cloud Gateway", "Core Java (Multithreading)","Spring Caching" , "REST APIs"] },
        { category: "Event-Driven & Messaging", items: ["Kafka", "Kafka Streams", "Event Aggregation", "Priority-based Topic Switching"] },
        { category: "Databases & Caching", items: ["PostgreSQL", "Redis", "Distributed Caching", "Rate Limiting"] },
        { category: "DevOps & Cloud", items: ["Kubernetes", "Docker", "AWS (ELB, ASG)", "Git (GitLab, Bitbucket)"] },
        { category: "AI/ML & Data", items: ["PySpark", "Scikit-learn", "OpenCV", "Pandas", "NumPy", "LangChain", "Scrapy"] },
        { category: "Frontend & Other", items: ["React", "HTML/CSS", "FastAPI", "Django", "Flask", "JasperSoft Studio"] }
      ],

      contact: {
        formUrl: "https://docs.google.com/forms/d/e/1FAIpQLSfbymlzoUkKYxKG-d74tts8Fvcn5SxF98s2aC2vc7jaEjTwpQ/viewform?embedded=true",
        items: [
          { icon: "ti-email", text: "rbw1906@gmail.com", link: null },
          { icon: "ti-linkedin", text: "linkedin.com/in/bharathwajan", link: "https://www.linkedin.com/in/bharathwajan/" },
          { icon: "ti-github", text: "github.com/bharathwajan", link: "https://github.com/bharathwajan" },
          { icon: "ti-pencil-alt", text: "medium.com/@bharathwajan", link: "https://medium.com/@bharathwajan" },
          { icon: "ti-location-pin", text: "Thiruvananthapuram, Kerala, India", link: null }
        ]
      },

      socialLinks: [
        { label: "LinkedIn", url: "https://www.linkedin.com/in/bharathwajan/" },
        { label: "GitHub", url: "https://github.com/bharathwajan" },
        { label: "Medium", url: "https://medium.com/@bharathwajan" }
      ]
    };

    // ╔══════════════════════════════════════════════════════════════════╗
    // ║  RENDERING — you don't need to edit below this line            ║
    // ╚══════════════════════════════════════════════════════════════════╝
    function render() {
      const d = DATA;
      document.getElementById('app').innerHTML = `
      <nav>
        <div class="container">
          <a href="#" class="nav-logo">${d.initials}.</a>
          <ul class="nav-links" id="navLinks">
            <li><a href="#about">About</a></li>
            <li><a href="#experience">Experience</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#contact">Contact</a></li>
          </ul>
          <button class="nav-toggle" onclick="document.getElementById('navLinks').classList.toggle('active')">
            <span class="ti-menu"></span>
          </button>
        </div>
      </nav>

      <section class="hero">
        <div class="container">
          <div class="hero-content fade-up">
            <div class="hero-label">${d.tagline}</div>
            <h1>${d.heroHeading}</h1>
            <p>${d.heroDescription}</p>
            <div class="hero-btns">
              <a href="${d.cvLink}" class="btn btn-primary"><span class="ti-download"></span> Download CV</a>
              <a href="#contact" class="btn btn-outline">Get in Touch</a>
            </div>
          </div>
        </div>
      </section>

      <section id="about">
        <div class="container">
          <div class="section-label fade-up">About me</div>
          <div class="about-grid">
            <img src="${d.photo}" alt="${d.name}" class="about-img fade-up">
            <div class="about-text fade-up">
              <p>${d.about.description}</p>
              <ul class="about-meta">
                ${d.about.meta.map(m => `<li><strong>${m.label}</strong>${m.value}</li>`).join('')}
              </ul>
              <a href="${d.cvLink}" class="btn btn-outline"><span class="ti-file"></span> Download CV</a>
            </div>
          </div>
        </div>
      </section>

      <section id="experience">
        <div class="container">
          <div class="section-label fade-up">Background</div>
          <h2 class="section-title fade-up">Experience & Education</h2>
          <div class="two-col">
            <div class="fade-up">
              <h3 style="font-size:1.1rem; margin-bottom:24px; color:var(--text);">Experience</h3>
              <ul class="timeline">
                ${d.experience.map(e => `<li><div class="date">${e.date}</div><h4>${e.title}</h4><div class="org">${e.org}</div>${e.extra ? `<div class="extra">${e.extra}</div>` : ''}</li>`).join('')}
              </ul>
            </div>
            <div class="fade-up">
              <h3 style="font-size:1.1rem; margin-bottom:24px; color:var(--text);">Education</h3>
              <ul class="timeline">
                ${d.education.map(e => `<li><div class="date">${e.date}</div><h4>${e.title}</h4><div class="org">${e.org}</div>${e.extra ? `<div class="extra">${e.extra}</div>` : ''}</li>`).join('')}

          <div class="services-grid">
            ${d.skills.map(s => `<div class="service-card fade-up"><h3>${s.category}</h3><div class="skill-tags">${s.items.map(i => `<span class="skill-tag">${i}</span>`).join('')}</div></div>`).join('')}
          </div>
        </div>
      </section>

      <section id="contact">
        <div class="container">
          <div class="section-label fade-up">Get in touch</div>
          <h2 class="section-title fade-up">Contact</h2>
          <div class="fade-up">
            <ul class="contact-info">
              ${d.contact.items.map(c => `<li><div class="icon-box"><span class="${c.icon}"></span></div>${c.link ? `<a href="${c.link}" target="_blank">${c.text}</a>` : `<span>${c.text}</span>`}</li>`).join('')}
            </ul>
          </div>
        </div>
      </section>

      <footer>
        <div class="container">
          <div class="footer-grid">
            <div>

              <p style="font-size:0.85rem; color:var(--text-secondary); max-width:280px;">${d.footerTagline}</p>

            <div>

      // Activate scroll animations
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
      }, { threshold: 0.1 });
      document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
    }

    render();
  </script>
</body>
</html>
